<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>

    <!-- Font Awesome (used for the footer's small link icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <main class="widget-container">

        <!-- Masthead: compact lockup, image + tag-line -->
        <header class="widget-masthead">
            <img src="img/basket-icon.svg" alt="Minimal line-art icon of a shopping basket" class="masthead-image">
            <div class="masthead-text">
                <h1 class="widget-title">Shopping List</h1>
                <p class="widget-tagline">What do you need to buy today?</p>
            </div>
        </header>

        <!-- Main Content -->
        <section class="widget-content">

            <label for="item-input" class="field-label">Item</label>
            <input type="text" id="item-input" placeholder="Start typing an item&hellip;" autocomplete="off">

            <button id="add-item-btn" type="button">ADD TO LIST</button>

            <p class="feedback" id="error-feedback"></p>

            <ol class="item-list" id="dynamic-list"></ol>

        </section>

        <!-- Footer: text-style social-media links -->
        <footer class="widget-footer">
            <nav class="social-links" aria-label="Social media links">
                <a href="#"><i class="fab fa-facebook-f" aria-hidden="true"></i><span>Facebook</span></a>
                <a href="#"><i class="fab fa-instagram" aria-hidden="true"></i><span>Instagram</span></a>
                <a href="#"><i class="fab fa-pinterest-p" aria-hidden="true"></i><span>Pinterest</span></a>
            </nav>
        </footer>

    </main>

    <script src="js/main.js"></script>
</body>
</html>
